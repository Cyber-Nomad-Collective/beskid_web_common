name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set on all @beskid packages (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@cyber-nomad-collective"

      - name: Install
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Set version from tag or input
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply version to publishable packages
        run: |
          VER="${{ steps.ver.outputs.version }}"
          for pkg in packages/trudoc packages/spec-core packages/spec-cli packages/beskid-ui packages/beskid-ui-react packages/beskid-auth-client packages/beskid-server-observability; do
            node -e "
              const fs = require('fs');
              const p = '$pkg/package.json';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = '$VER';
              for (const section of ['dependencies', 'peerDependencies']) {
                const deps = j[section];
                if (!deps) continue;
                for (const [name, spec] of Object.entries(deps)) {
                  if (spec === 'workspace:*' && name.startsWith('@cyber-nomad-collective/')) {
                    deps[name] = '^' + '$VER';
                  }
                }
              }
              fs.writeFileSync(p, JSON.stringify(j, null, '\t') + '\n');
            "
          done

      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          REGISTRY="https://npm.pkg.github.com"
          PACKAGES=(
            packages/trudoc
            packages/spec-core
            packages/spec-cli
            packages/beskid-ui
            packages/beskid-ui-react
            packages/beskid-auth-client
            packages/beskid-server-observability
          )

          pkg_name() {
            node -pe "require('./${1}/package.json').name"
          }

          pkg_published() {
            npm view "$(pkg_name "$1")@${VER}" version --registry="${REGISTRY}" >/dev/null 2>&1
          }

          for pkg in "${PACKAGES[@]}"; do
            name="$(pkg_name "${pkg}")"
            if pkg_published "${pkg}"; then
              echo "Skip ${name}@${VER} (already on GitHub Packages)"
              continue
            fi
            echo "Publishing ${name}@${VER} from ${pkg}..."
            (cd "${pkg}" && npm publish --access public --provenance=false)
          done

          echo "Verifying all packages are available at ${VER}..."
          missing=0
          for pkg in "${PACKAGES[@]}"; do
            name="$(pkg_name "${pkg}")"
            if ! pkg_published "${pkg}"; then
              echo "::error::Missing ${name}@${VER} on GitHub Packages"
              missing=1
            else
              echo "OK ${name}@$(npm view "${name}@${VER}" version --registry="${REGISTRY}")"
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
