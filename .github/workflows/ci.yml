name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.17.1"

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build beskid-ui hub client
        run: pnpm run build
